<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 96" width="420" height="96" role="img" aria-label="ferrisbar">
  <title>ferrisbar</title>
  <defs>
    <linearGradient id="lg-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="1" stop-color="#E05D28"/>
    </linearGradient>
  </defs>

  <!-- mark: a terminal tile holding a prompt chevron and a status bar -->
  <g>
    <rect x="8" y="12" width="72" height="72" rx="18" fill="url(#lg-tile)"/>
    <path d="M26 34 L40 48 L26 62" fill="none" stroke="#FFF7ED" stroke-width="7"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="48" y="42" width="8" height="12" rx="3" fill="#FFF7ED"/>
    <rect x="60" y="42" width="8" height="12" rx="3" fill="#FFF7ED" opacity="0.55"/>
  </g>

  <!-- wordmark -->
  <text x="98" y="61" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="40" font-weight="700" fill="#E05D28" letter-spacing="-0.5">ferris<tspan fill="#8A8580">bar</tspan></text>
</svg>
