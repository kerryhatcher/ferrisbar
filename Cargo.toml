[package]
name = "ferrisbar"
version = "0.3.0"
edition = "2021"
rust-version = "1.85.1"
description = "A Claude Code statusline renderer, written in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/kerryhatcher/ferrisbar"
readme = "README.md"
keywords = ["claude-code", "statusline", "cli"]
categories = ["command-line-utilities"]
exclude = ["docs/", "assets/"]

[[bin]]
name = "ferrisbar"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Pinned below 1.2: toml 1.1.3 declares rust-version 1.85, one patch under
# our 1.85.1 MSRV. An unbounded range lets `cargo update` break `just msrv`
# with no code change to attribute it to.
toml = { version = ">=1.1, <1.2", default-features = false, features = ["std", "parse", "serde"] }
# rust_backend routes through pure-Rust miniz_oxide instead of libz-sys,
# keeping a C toolchain out of the build and cargo-geiger's unsafe count down.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust embedded storage for the optional per-repo cost analytics
# store — no C toolchain, unlike rusqlite/Diesel's SQLite backends. See
# docs/superpowers/specs/2026-08-11-repo-cost-analytics-design.md.
redb = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"

[features]
analytics = ["dep:redb"]
